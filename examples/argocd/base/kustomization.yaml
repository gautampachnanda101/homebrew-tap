apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Create namespace first
  - namespace.yaml
  # Install official ArgoCD
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - certificate.yaml
  - ingress.yaml

# Patch argocd-server to run in insecure mode (TLS handled by Traefik)
patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - argocd-server
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - --insecure

# Common labels
labels:
  - pairs:
      app.kubernetes.io/part-of: argocd
