apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - ../../base

patches:
  - target:
      kind: Certificate
      name: authentik-tls
    patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: authentik-tls
      spec:
        issuerRef:
          name: local-dev-ca-issuer
          kind: ClusterIssuer
        dnsNames:
          - authentik.127.0.0.1.sslip.io
  
  - target:
      kind: IngressRoute
      name: authentik
    patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: authentik
      spec:
        routes:
          - match: Host(`authentik.127.0.0.1.sslip.io`)
            kind: Rule
            services:
              - name: authentik-server
                port: 9000
