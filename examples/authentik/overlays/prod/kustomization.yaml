apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - ../../base

patches:
  - target:
      kind: Certificate
      name: authentik-tls
    patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: authentik-tls
      spec:
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - DOMAIN.PLACEHOLDER
  
  - target:
      kind: IngressRoute
      name: authentik
    patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: authentik
      spec:
        routes:
          - match: Host(`DOMAIN.PLACEHOLDER`)
            kind: Rule
            services:
              - name: authentik-server
                port: 9000
  
  - target:
      kind: Deployment
      name: authentik-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authentik-server
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: server
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"
  
  - target:
      kind: Deployment
      name: authentik-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authentik-worker
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: worker
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "300m"
                limits:
                  memory: "1Gi"
                  cpu: "600m"
