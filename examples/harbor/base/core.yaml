apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-core
  namespace: harbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-core
  template:
    metadata:
      labels:
        app: harbor-core
    spec:
      containers:
      - name: core
        image: goharbor/harbor-core:v2.10.0
        env:
        - name: CORE_SECRET
          value: "not-a-secure-secret"
        - name: JOBSERVICE_SECRET
          value: "not-a-secure-secret"
        - name: DATABASE_TYPE
          value: "postgresql"
        - name: POSTGRESQL_HOST
          value: "postgres"
        - name: POSTGRESQL_PORT
          value: "5432"
        - name: POSTGRESQL_USERNAME
          value: "harbor"
        - name: POSTGRESQL_PASSWORD
          value: "harbor"
        - name: POSTGRESQL_DATABASE
          value: "harbor"
        - name: REGISTRY_URL
          value: "http://registry:5000"
        - name: TOKEN_SERVICE_URL
          value: "http://harbor-core:8080"
        - name: HARBOR_ADMIN_PASSWORD
          value: "Harbor12345"
        - name: EXT_ENDPOINT
          value: "https://DOMAIN.PLACEHOLDER"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-core
  namespace: harbor
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: harbor-core
