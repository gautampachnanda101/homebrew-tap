apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor

resources:
  - ../../base

patches:
  - target:
      kind: Certificate
      name: harbor-tls
    patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: harbor-tls
      spec:
        issuerRef:
          name: local-dev-ca-issuer
          kind: ClusterIssuer
        dnsNames:
          - harbor.127.0.0.1.sslip.io
  
  - target:
      kind: IngressRoute
      name: harbor
    patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: harbor
      spec:
        routes:
          - match: Host(`harbor.127.0.0.1.sslip.io`)
            kind: Rule
            services:
              - name: harbor-portal
                port: 8080
  
  - target:
      kind: Deployment
      name: harbor-core
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: harbor-core
      spec:
        template:
          spec:
            containers:
            - name: core
              env:
              - name: EXT_ENDPOINT
                value: "https://harbor.127.0.0.1.sslip.io"
