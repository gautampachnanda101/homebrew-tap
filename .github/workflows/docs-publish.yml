name: Publish Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'Makefile'
      - 'mkdocs.yml'
      - '.github/workflows/docs-publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Validate documentation build
        run: |
          echo "Validating documentation..."
          mkdocs build --strict
          echo "✓ Documentation validated"

      - name: Run validation scripts
        run: |
          echo "Running validation checks..."
          python scripts/validate-docs.py
          python scripts/lint-markdown.py
          python scripts/validate-code-examples.py
          python scripts/check-links.py
          echo "✓ All validations passed"

      - name: Build documentation
        run: |
          echo "Building documentation for deployment..."
          mkdocs build
          echo "✓ Documentation built successfully"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment summary
        run: |
          DOCS_URL="${{ steps.deployment.outputs.page_url }}"
          echo "## 🚀 Documentation Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View at: [$DOCS_URL]($DOCS_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
