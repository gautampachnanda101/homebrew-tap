name: Test Examples

on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - '.github/workflows/test-examples.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/**'
      - '.github/workflows/test-examples.yml'
  workflow_dispatch:

jobs:
  test-argocd:
    name: Test ArgoCD Example
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install k3d-local from tap
        run: |
          brew tap gautampachnanda101/tap
          brew install k3d-local
          k3d-local --version

      - name: Create k3d cluster with Traefik
        run: |
          k3d-local create --name dev --with-traefik
          kubectl cluster-info
          kubectl get nodes

      - name: Wait for Traefik to be ready
        run: |
          echo "Waiting for Traefik deployment..."
          kubectl wait --for=condition=available --timeout=300s deployment/traefik -n kube-system || true
          kubectl get pods -n kube-system
          kubectl get svc -n kube-system

      - name: Verify cert-manager ClusterIssuers
        run: |
          kubectl get clusterissuers
          kubectl get clusterissuer local-dev-ca-issuer -o yaml

      - name: Install ArgoCD (local overlay)
        working-directory: examples/argocd
        run: |
          echo "Installing ArgoCD..."
          ./install.sh || { echo "Install failed, checking logs..."; kubectl get all -n argocd; exit 1; }

      - name: Wait for ArgoCD pods to be ready
        run: |
          echo "Checking ArgoCD namespace..."
          if ! kubectl get namespace argocd; then
            echo "❌ ArgoCD namespace not found"
            exit 1
          fi
          
          echo "Waiting for ArgoCD deployments to be created..."
          timeout 60s bash -c 'until kubectl get deployment argocd-server -n argocd 2>/dev/null; do echo "Waiting for argocd-server deployment..."; sleep 2; done'
          
          echo "Current deployments:"
          kubectl get deployments -n argocd
          
          echo "Waiting for argocd-server (timeout: 300s)..."
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd || {
            echo "❌ ArgoCD server deployment failed to become available"
            echo ""
            echo "Pod status:"
            kubectl get pods -n argocd -o wide
            echo ""
            echo "Pod descriptions:"
            kubectl describe pods -n argocd | grep -A 10 "Events:" || true
            echo ""
            echo "Pod logs (argocd-server):"
            kubectl logs -n argocd -l app.kubernetes.io/name=argocd-server --tail=100 || true
            exit 1
          }
          
          echo "✓ ArgoCD server is ready"
          kubectl get all -n argocd

      - name: Verify ArgoCD certificate
        run: |
          echo "Checking certificates..."
          kubectl get certificate -n argocd || echo "No certificates found"
          kubectl describe certificate argocd-tls -n argocd || echo "Certificate not ready yet"

      - name: Verify ArgoCD ingress
        run: |
          echo "Checking IngressRoute..."
          kubectl get ingressroute -n argocd || echo "No IngressRoute found"
          kubectl describe ingressroute argocd-server -n argocd || echo "IngressRoute not ready yet"

      - name: Get ArgoCD admin password
        working-directory: examples/argocd
        run: |
          echo "Retrieving admin password..."
          timeout 30s ./get-password.sh || { 
            echo "Failed to get password"
            kubectl get secret -n argocd
            exit 1
          }

      - name: Test ArgoCD API accessibility
        run: |
          echo "Testing ArgoCD API..."
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          PF_PID=$!
          sleep 10
          
          curl -k -v https://localhost:8080/healthz || echo "API test completed"
          kill $PF_PID || true

      - name: Cleanup ArgoCD
        if: always()
        working-directory: examples/argocd
        run: |
          ./uninstall.sh || true

      - name: Cleanup cluster
        if: always()
        run: |
          k3d-local delete --name dev || true

  test-kustomize-syntax:
    name: Validate Kustomize Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Validate ArgoCD base
        working-directory: examples/argocd/base
        run: |
          echo "Building base kustomization..."
          kustomize build . > /tmp/argocd-base.yaml
          echo "✓ Base kustomization is valid"
          wc -l /tmp/argocd-base.yaml

      - name: Validate ArgoCD local overlay
        working-directory: examples/argocd/overlays/local
        run: |
          echo "Building local overlay..."
          kustomize build . > /tmp/argocd-local.yaml
          echo "✓ Local overlay is valid"
          wc -l /tmp/argocd-local.yaml
          
          # Verify local-specific patches
          grep -q "local-dev-ca-issuer" /tmp/argocd-local.yaml
          grep -q "argocd.127.0.0.1.sslip.io" /tmp/argocd-local.yaml
          echo "✓ Local patches applied correctly"

      - name: Validate ArgoCD prod overlay
        working-directory: examples/argocd/overlays/prod
        run: |
          echo "Building prod overlay..."
          kustomize build . > /tmp/argocd-prod.yaml
          echo "✓ Prod overlay is valid"
          wc -l /tmp/argocd-prod.yaml
          
          # Verify prod-specific patches
          grep -q "letsencrypt-prod" /tmp/argocd-prod.yaml
          grep -q "replicas: 2" /tmp/argocd-prod.yaml
          echo "✓ Prod patches applied correctly"

      - name: Validate Vault overlays
        run: |
          echo "Validating Vault..."
          kustomize build examples/vault/base > /tmp/vault-base.yaml
          kustomize build examples/vault/overlays/local > /tmp/vault-local.yaml
          kustomize build examples/vault/overlays/prod > /tmp/vault-prod.yaml
          echo "✓ Vault validated"

      - name: Validate Harbor overlays
        run: |
          echo "Validating Harbor..."
          kustomize build examples/harbor/base > /tmp/harbor-base.yaml
          kustomize build examples/harbor/overlays/local > /tmp/harbor-local.yaml
          kustomize build examples/harbor/overlays/prod > /tmp/harbor-prod.yaml
          echo "✓ Harbor validated"

      - name: Validate GitLab Runner overlays
        run: |
          echo "Validating GitLab Runner..."
          kustomize build examples/gitlab-runner/base > /tmp/gitlab-runner-base.yaml
          kustomize build examples/gitlab-runner/overlays/local > /tmp/gitlab-runner-local.yaml
          kustomize build examples/gitlab-runner/overlays/prod > /tmp/gitlab-runner-prod.yaml
          echo "✓ GitLab Runner validated"

      - name: Validate Keycloak overlays
        run: |
          echo "Validating Keycloak..."
          kustomize build examples/keycloak/base > /tmp/keycloak-base.yaml
          kustomize build examples/keycloak/overlays/local > /tmp/keycloak-local.yaml
          kustomize build examples/keycloak/overlays/prod > /tmp/keycloak-prod.yaml
          echo "✓ Keycloak validated"

      - name: Validate Authentik overlays
        run: |
          echo "Validating Authentik..."
          kustomize build examples/authentik/base > /tmp/authentik-base.yaml
          kustomize build examples/authentik/overlays/local > /tmp/authentik-local.yaml
          kustomize build examples/authentik/overlays/prod > /tmp/authentik-prod.yaml
          echo "✓ Authentik validated"

      - name: Check for deprecated commonLabels
        run: |
          if grep -r "commonLabels:" examples/; then
            echo "❌ Found deprecated commonLabels - use 'labels' instead"
            exit 1
          fi
          echo "✓ No deprecated commonLabels found"
